apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "ru.netology.testing.uiautomator"
    compileSdk 34

    defaultConfig {
        applicationId "ru.netology.testing.uiautomator"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Core libraries
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"

    // --- ДЛЯ LocalTest.kt (JUnit 4) ---
    // Эта зависимость решает ошибки Unresolved reference: Assert, Test, assertEquals
    testImplementation 'junit:junit:4.13.2'

    // --- ДЛЯ AppiumChangeTextTest.kt (JUnit 5 + Appium) ---
    testImplementation("io.appium:java-client:9.3.0")
    testImplementation("org.seleniumhq.selenium:selenium-java:4.21.0")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")

    // Instrumented tests (UI Automator)
    androidTestImplementation "androidx.test:core-ktx:1.5.0"
    androidTestImplementation "androidx.test.ext:junit-ktx:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.0"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    androidTestImplementation "org.hamcrest:hamcrest-integration:1.3"
}

// Настройка запуска JUnit 5 для локальных тестов
tasks.withType(Test) {
    useJUnitPlatform()
}
